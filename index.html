<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GUNGATOUR — We Suck at Golf</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Permanent+Marker&family=Rubik+Bubbles&display=swap');

    :root {
      --crimson: #841617;
      --deep-crimson: #5a0f10;
      --cream: #FDF9F0;
      --gold: #f0c040;
      --psycho1: #ff6b35;
      --psycho2: #9b59b6;
      --psycho3: #1abc9c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow-x: hidden;
      background: #0a0000;
    }

    /* ---- TRIPPY BACKGROUND ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(132,22,23,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(155,89,182,0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(26,188,156,0.2) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes bgPulse {
      0%   { filter: hue-rotate(0deg) brightness(1); }
      50%  { filter: hue-rotate(15deg) brightness(1.15); }
      100% { filter: hue-rotate(-10deg) brightness(0.9); }
    }

    /* ---- GOLF BALL FIELD ---- */
    .balls-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .golf-ball {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #ccc);
      box-shadow:
        inset -3px -3px 6px rgba(0,0,0,0.3),
        0 0 20px rgba(255,255,255,0.1);
      animation: floatBall linear infinite;
      opacity: 0.15;
    }

    @keyframes floatBall {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.2; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
    }

    /* ---- MAIN CONTAINER ---- */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 5rem;
      text-align: center;
    }

    /* ---- WOBBLY HEADER ---- */
    .site-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.2rem, 4vw, 2rem);
      letter-spacing: 0.5em;
      color: var(--gold);
      text-transform: uppercase;
      animation: sway 3s ease-in-out infinite;
      margin-bottom: 3rem;
      text-shadow: 0 0 30px rgba(240,192,64,0.5);
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-1deg) translateX(-4px); }
      50%       { transform: rotate(1deg)  translateX(4px);  }
    }

    /* ---- MAIN HEADLINE ---- */
    .headline {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(3rem, 12vw, 9rem);
      line-height: 1;
      text-transform: uppercase;
      position: relative;
      margin-bottom: 1.5rem;
    }

    .word {
      display: inline-block;
      position: relative;
    }

    .word-WE    { color: var(--cream);   animation: wobble 2.1s ease-in-out infinite; }
    .word-LIVE  { color: var(--crimson); animation: wobble 2.3s ease-in-out infinite 0.1s; text-shadow: 0 0 40px rgba(132,22,23,0.8); }
    .word-IN    { color: var(--cream);   animation: wobble 1.9s ease-in-out infinite 0.2s; }
    .word-OK    { color: var(--crimson); animation: bigPulse 1.5s ease-in-out infinite; font-size: clamp(4rem, 16vw, 12rem); text-shadow: 0 0 60px rgba(132,22,23,1), 0 0 120px rgba(132,22,23,0.5); }
    .word-AND   { color: var(--cream);   animation: wobble 2.4s ease-in-out infinite 0.3s; }
    .word-WE2   { color: var(--cream);   animation: wobble 2.0s ease-in-out infinite 0.15s; }
    .word-SUCK  { color: var(--gold);    animation: suckAnim 0.8s ease-in-out infinite; font-size: clamp(4.5rem, 17vw, 13rem); text-shadow: 0 0 40px rgba(240,192,64,0.8); }
    .word-AT    { color: var(--cream);   animation: wobble 2.2s ease-in-out infinite 0.25s; }
    .word-GOLF  {
      color: var(--crimson);
      animation: golfSpin 6s linear infinite;
      display: inline-block;
      font-size: clamp(4rem, 15vw, 11rem);
      text-shadow: 0 0 50px rgba(132,22,23,1), 0 0 100px rgba(132,22,23,0.6), 0 0 200px rgba(132,22,23,0.3);
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-2deg) translateY(0px); }
      25%       { transform: rotate(1deg)  translateY(-5px); }
      75%       { transform: rotate(-1deg) translateY(3px);  }
    }

    @keyframes bigPulse {
      0%, 100% { transform: scale(1) rotate(-1deg); filter: brightness(1); }
      50%       { transform: scale(1.06) rotate(1deg); filter: brightness(1.3); }
    }

    @keyframes suckAnim {
      0%, 100% { transform: skewX(-3deg) scale(1); }
      50%       { transform: skewX(3deg)  scale(1.04); }
    }

    @keyframes golfSpin {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(30deg); }
    }

    /* lines layout */
    .line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0.2em;
      line-height: 1.1;
      margin-bottom: 0.1em;
    }

    /* ---- DIVIDER ---- */
    .divider {
      margin: 3rem auto;
      width: 80%;
      max-width: 600px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--crimson), var(--gold), var(--crimson), transparent);
      border-radius: 2px;
      animation: shimmer 3s linear infinite;
      position: relative;
    }

    .divider::before {
      content: '⛳';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      animation: spinGolf 4s linear infinite;
      filter: drop-shadow(0 0 10px var(--crimson));
    }

    @keyframes shimmer {
      0%   { filter: brightness(1)   hue-rotate(0deg); }
      50%  { filter: brightness(1.5) hue-rotate(20deg); }
      100% { filter: brightness(1)   hue-rotate(0deg); }
    }

    @keyframes spinGolf {
      0%   { transform: translate(-50%, -50%) rotate(0deg)   scale(1); }
      50%  { transform: translate(-50%, -50%) rotate(180deg) scale(1.3); }
      100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
    }

    /* ---- TLDR ---- */
    .tldr-section {
      font-family: 'Rubik Bubbles', cursive;
      margin-top: 1rem;
    }

    .tldr-label {
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      color: var(--gold);
      opacity: 0.7;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .tldr-text {
      font-size: clamp(1.4rem, 4vw, 2.5rem);
      color: var(--cream);
      text-shadow: 0 0 20px rgba(253,249,240,0.4);
      animation: tldrFloat 4s ease-in-out infinite;
    }

    @keyframes tldrFloat {
      0%, 100% { transform: translateY(0px); opacity: 0.9; }
      50%       { transform: translateY(-8px); opacity: 1; }
    }

    /* ---- EGGPLANTS ---- */
    .eggplant-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .eggplant {
      position: absolute;
      font-size: 2.5rem;
      animation: floatPlant linear infinite;
      opacity: 0;
      filter: drop-shadow(0 0 8px rgba(155,89,182,0.8));
    }

    @keyframes floatPlant {
      0%   { transform: translateY(110vh) rotate(0deg)   scale(0.8); opacity: 0; }
      8%   { opacity: 0.85; }
      92%  { opacity: 0.85; }
      100% { transform: translateY(-15vh) rotate(-180deg) scale(1.2); opacity: 0; }
    }

    /* ---- WAVY SCANLINES OVERLAY ---- */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.03) 3px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 99;
      animation: scanMove 8s linear infinite;
    }

    @keyframes scanMove {
      0%   { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }

    /* ---- FOOTER ---- */
    .footer {
      position: fixed;
      bottom: 1rem;
      font-family: monospace;
      font-size: 0.7rem;
      color: rgba(253,249,240,0.2);
      letter-spacing: 0.2em;
      animation: footerBlink 5s ease-in-out infinite;
    }

    @keyframes footerBlink {
      0%, 100% { opacity: 0.2; }
      50%       { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <!-- Floating golf balls -->
  <div class="balls-field" id="ballsField"></div>

  <!-- Floating eggplants -->
  <div class="eggplant-field" id="eggplantField"></div>

  <div class="container">

    <div class="site-title">GUNGATOUR</div>

    <div class="headline">
      <div class="line">
        <span class="word word-WE">WE</span>
        <span class="word word-LIVE">LIVE</span>
        <span class="word word-IN">IN</span>
      </div>
      <div class="line">
        <span class="word word-OK">OKLAHOMA</span>
      </div>
      <div class="line">
        <span class="word word-AND">AND</span>
        <span class="word word-WE2">WE</span>
      </div>
      <div class="line">
        <span class="word word-SUCK">SUCK</span>
      </div>
      <div class="line">
        <span class="word word-AT">AT</span>
        <span class="word word-GOLF">GOLF</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="tldr-section">
      <div class="tldr-label">tl;dr</div>
      <div class="tldr-text">We just suck at golf.</div>
    </div>

  </div>

  <div class="footer">gungatour.com &nbsp;|&nbsp; established whenever we felt like it</div>

  <script>
    // Spawn floating golf balls
    const field = document.getElementById('ballsField');
    const BALL_COUNT = 18; // one per hole, obviously

    for (let i = 0; i < BALL_COUNT; i++) {
      const ball = document.createElement('div');
      ball.classList.add('golf-ball');

      const size = 20 + Math.random() * 60;
      const left = Math.random() * 100;
      const dur  = 12 + Math.random() * 20;
      const delay = -(Math.random() * dur);

      ball.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${left}%;
        animation-duration: ${dur}s;
        animation-delay: ${delay}s;
      `;
      field.appendChild(ball);
    }

    // Spawn floating eggplants
    const eplantField = document.getElementById('eggplantField');
    const EGGPLANT_COUNT = 7;
    for (let i = 0; i < EGGPLANT_COUNT; i++) {
      const ep = document.createElement('div');
      ep.classList.add('eggplant');
      ep.textContent = '🍆';
      const left  = 5 + Math.random() * 90;
      const dur   = 15 + Math.random() * 18;
      const delay = -(Math.random() * dur);
      ep.style.cssText = `left:${left}%; animation-duration:${dur}s; animation-delay:${delay}s;`;
      eplantField.appendChild(ep);
    }

    // Subtle mouse parallax on headline
    const headline = document.querySelector('.headline');
    document.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth  / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;
      headline.style.transform = `translate(${dx * 8}px, ${dy * 6}px)`;
    });
  </script>
</body>
</html>
